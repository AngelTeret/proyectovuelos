<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nueva contraseña - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="flex min-h-[100dvh] items-center justify-center overflow-y-auto bg-slate-50 px-4 py-6 font-sans text-slate-800 antialiased" style="padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
  <main class="w-full max-w-md rounded-2xl bg-white p-5 shadow-sm sm:p-8">
    <a href="/index.html" class="mb-8 flex justify-center">
      <img src="/imagenes/logotipo_frase.svg" alt="Quetzal Airlines. El cielo de Guatemala" class="h-24 w-auto">
    </a>
    <h1 id="titulo" class="text-center text-2xl font-bold text-slate-900">Nueva contraseña</h1>
    <p id="mensaje" class="mt-2 text-center text-sm text-slate-500">Estamos revisando el enlace.</p>
    <form id="form-restablecer" class="mt-8 hidden space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-xs font-medium text-slate-600">Contraseña</span>
        <span class="mb-1.5 block text-xs text-slate-400">De 8 a 72 caracteres.</span>
        <span class="relative block">
          <input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-3 py-3 pr-12 text-sm text-slate-800 outline-none focus:border-blue-400">
          <button type="button" data-ver-contrasena="password" aria-label="Mostrar contraseña" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600">
            <svg data-icono="mostrar" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            <svg data-icono="ocultar" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </span>
      </label>
      <label class="block">
        <span class="mb-1.5 block text-xs font-medium text-slate-600">Repite la contraseña</span>
        <span class="relative block">
          <input id="password-2" name="password_2" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-3 py-3 pr-12 text-sm text-slate-800 outline-none focus:border-blue-400">
          <button type="button" data-ver-contrasena="password-2" aria-label="Mostrar contraseña" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600">
            <svg data-icono="mostrar" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            <svg data-icono="ocultar" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </span>
      </label>
      <button type="submit" class="h-11 w-full rounded-xl bg-blue-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">Guardar contraseña</button>
    </form>
    <p id="volver" class="mt-6 hidden text-center text-sm text-slate-500">
      <a href="/olvide.html" class="font-semibold text-blue-600 hover:text-blue-700">Pedir otro enlace</a>
    </p>
  </main>
  <script src="/js/verContrasena.js"></script>
  <script src="/js/restablecer.js"></script>
</body>
</html>
