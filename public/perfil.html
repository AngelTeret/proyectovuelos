<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <script>
    ['token', 'rol', 'nombre', 'usuario_id'].forEach((clave) => localStorage.removeItem(clave));
    if (!sessionStorage.getItem('token')) {
      localStorage.setItem('redirectAfterLogin', '/perfil');
      location.replace('/login');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Perfil - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-4 py-6 sm:px-8">
        <section class="overflow-hidden rounded-3xl bg-white shadow-sm">
          <div class="flex flex-col gap-6 p-6 sm:flex-row sm:items-center sm:justify-between sm:p-8">
            <div class="min-w-0">
              <p class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Perfil</p>
              <h1 id="titulo-nombre" class="mt-2 truncate text-2xl font-bold text-slate-900 sm:text-3xl">—</h1>
              <p id="correo" class="mt-1 truncate text-sm text-slate-500">—</p>
              <div class="mt-4 flex flex-wrap gap-2">
                <span id="rol" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">—</span>
                <span id="confirmado" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">—</span>
              </div>
            </div>
            <div id="bloque-saldo" class="hidden w-full shrink-0 rounded-2xl bg-[#f3f7f4] px-5 py-4 sm:w-auto sm:min-w-44 sm:text-right">
              <p class="text-xs font-semibold uppercase tracking-wide text-[#0B4C37]/70">Saldo</p>
              <p id="saldo" class="mt-1 text-2xl font-bold tracking-tight text-[#0B4C37]">—</p>
            </div>
          </div>
        </section>

        <div class="mt-4 grid items-stretch gap-4 xl:grid-cols-2">
          <section class="flex flex-col rounded-3xl bg-white p-6 shadow-sm sm:p-8">
            <h2 class="text-lg font-semibold text-slate-900">Nombre</h2>
            <p class="mt-1 text-sm text-slate-500">Así aparece en el menú y en tus reservas. Hasta 100 caracteres.</p>
            <form id="form-nombre" class="mt-5 flex flex-1 flex-col gap-4">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre completo</span>
                <input id="nombre" name="nombre" type="text" required maxlength="100" autocomplete="name" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 text-sm text-slate-800 outline-none focus:border-blue-400 focus:bg-white">
              </label>
              <p id="regla-nombre" class="text-sm text-slate-500">Puedes escribir hasta 100 caracteres.</p>
              <button type="submit" class="mt-auto h-11 w-fit rounded-xl bg-blue-600 px-5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60">Guardar nombre</button>
            </form>
          </section>

          <section class="flex flex-col rounded-3xl bg-white p-6 shadow-sm sm:p-8">
            <h2 class="text-lg font-semibold text-slate-900">Contraseña</h2>
            <p class="mt-1 text-sm text-slate-500">Primero escribe la que usas ahora. Luego elige otra y repítela igual.</p>
            <form id="form-clave" class="mt-5 flex flex-1 flex-col gap-4">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Contraseña actual</span>
                <span class="relative block">
                  <input id="clave-actual" type="password" required autocomplete="current-password" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 pr-12 text-sm text-slate-800 outline-none focus:border-blue-400 focus:bg-white">
                  <button type="button" data-ver-contrasena="clave-actual" aria-label="Mostrar contraseña" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600">
                    <svg data-icono="mostrar" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    <svg data-icono="ocultar" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                  </button>
                </span>
                <p class="mt-1.5 text-sm text-slate-500">La que usas para entrar ahora.</p>
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Contraseña nueva</span>
                <span class="relative block">
                  <input id="clave-nueva" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 pr-12 text-sm text-slate-800 outline-none focus:border-blue-400 focus:bg-white">
                  <button type="button" data-ver-contrasena="clave-nueva" aria-label="Mostrar contraseña" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600">
                    <svg data-icono="mostrar" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    <svg data-icono="ocultar" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                  </button>
                </span>
                <p id="nota-nueva" class="mt-1.5 text-sm text-slate-500">Entre 8 y 72 caracteres, y distinta a la que usas ahora.</p>
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Repite la contraseña nueva</span>
                <span class="relative block">
                  <input id="clave-repetir" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 pr-12 text-sm text-slate-800 outline-none focus:border-blue-400 focus:bg-white">
                  <button type="button" data-ver-contrasena="clave-repetir" aria-label="Mostrar contraseña" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-600">
                    <svg data-icono="mostrar" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                    <svg data-icono="ocultar" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                  </button>
                </span>
                <p id="nota-repetir" class="mt-1.5 text-sm text-slate-500">Escríbela otra vez, igual que la nueva.</p>
              </label>
              <div class="mt-auto flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <button type="submit" class="h-11 rounded-xl bg-blue-600 px-5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60">Cambiar contraseña</button>
                <a href="/olvide" class="text-sm font-semibold text-blue-600 hover:text-blue-700">Olvidé mi contraseña</a>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/verContrasena.js"></script>
  <script src="/js/perfil.js"></script>
</body>
</html>
