<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Administración - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
          <h1 class="text-xl font-bold text-slate-900 sm:text-2xl">Gestión de Vuelos</h1>
          <button id="btn-nuevo-vuelo" type="button" class="h-11 shrink-0 rounded-lg bg-blue-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">+ Nuevo Vuelo</button>
        </div>

        <section class="overflow-hidden rounded-2xl bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[720px] text-left text-sm">
              <thead class="border-b border-slate-100 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-3">ID</th>
                  <th class="px-5 py-3">Imagen</th>
                  <th class="px-5 py-3">Origen</th>
                  <th class="px-5 py-3">Destino</th>
                  <th class="px-5 py-3">Salida</th>
                  <th class="px-5 py-3">Duración</th>
                  <th class="px-5 py-3">Retraso</th>
                  <th class="px-5 py-3">Capacidad</th>
                  <th class="px-5 py-3">Precio Base</th>
                  <th class="px-5 py-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpo-vuelos" class="divide-y divide-slate-100 text-slate-700"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div id="modal-vuelo" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto bg-slate-900/50 p-4">
    <div class="my-auto max-h-[calc(100dvh-2rem)] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-5 shadow-xl sm:p-6" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-vuelo">
      <h2 id="titulo-modal-vuelo" class="text-xl font-bold text-slate-900">Agregar Nuevo Vuelo</h2>
      <form id="form-vuelo" class="mt-5 space-y-4">
        <input type="hidden" id="vuelo-id" name="vuelo_id">
        <label class="relative block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Origen</span>
          <input id="origen" name="origen" type="text" required autocomplete="off" placeholder="Busca un país" role="combobox" aria-expanded="false" aria-controls="lista-origen" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
          <ul id="lista-origen" role="listbox" class="absolute z-20 mt-1 hidden max-h-48 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"></ul>
        </label>
        <label class="relative block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Destino</span>
          <input id="destino" name="destino" type="text" required autocomplete="off" placeholder="Busca un país" role="combobox" aria-expanded="false" aria-controls="lista-destino" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
          <ul id="lista-destino" role="listbox" class="absolute z-20 mt-1 hidden max-h-48 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"></ul>
        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Fecha y Hora de Salida</span>
          <input id="fecha-salida" name="fecha_salida" type="datetime-local" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <div>
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Duración</span>
          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="mb-1.5 block text-xs text-slate-500">Horas</span>
              <input id="duracion-horas" name="duracion_horas" type="number" min="0" max="24" step="1" value="2" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs text-slate-500">Minutos</span>
              <input id="duracion-minutos" name="duracion_minutos" type="number" min="0" max="59" step="1" value="0" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
            </label>
          </div>
        </div>
        <div id="campo-retraso" class="hidden">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Retraso</span>
          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="mb-1.5 block text-xs text-slate-500">Horas</span>
              <input id="retraso-horas" name="retraso_horas" type="number" min="0" max="24" step="1" value="0" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs text-slate-500">Minutos</span>
              <input id="retraso-minutos" name="retraso_minutos" type="number" min="0" max="59" step="1" value="0" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
            </label>
          </div>
        </div>
        <div>
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Imagen</span>
          <img id="vista-imagen" alt="" class="mb-3 hidden h-24 w-40 rounded-xl object-cover">
          <div class="flex items-center gap-3">
            <label for="imagen-archivo" class="cursor-pointer rounded-lg bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100">Seleccionar archivo</label>
            <span id="nombre-archivo" class="min-w-0 truncate text-sm text-slate-500">Ningún archivo seleccionado</span>
          </div>
          <input id="imagen-archivo" name="imagen" type="file" accept="image/jpeg,image/png,image/webp" class="sr-only">
          <span class="mt-1.5 block text-xs text-slate-400">JPG, PNG o WEBP. Tamaño máximo de 2 MB.</span>
        </div>
        <label id="campo-capacidad" class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Capacidad de Asientos</span>
          <select id="capacidad-asientos" name="capacidad_asientos" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400"></select>

        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Precio Base (Q)</span>
          <input id="precio-base" name="precio_base" type="number" min="0" step="0.01" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <div class="flex items-center justify-end gap-3 pt-2">
          <button id="btn-cancelar-vuelo" type="button" class="rounded-lg bg-slate-200 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-300">Cancelar</button>
          <button id="btn-guardar-vuelo" type="submit" class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70">Guardar Vuelo</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/paises.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/administracion.js"></script>
</body>
</html>
