<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <aside class="flex w-[232px] shrink-0 flex-col border-r border-slate-100 bg-white px-4 py-5">
      <a href="index.html" class="mb-8 flex items-center gap-2.5 px-2">
        <svg class="h-7 w-7 text-blue-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
        <span class="text-[15px] font-semibold tracking-tight text-blue-950">Sistema de Vuelos</span>
      </a>

      <nav class="flex flex-1 flex-col gap-1" aria-label="Principal">
        <a href="index.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
          </svg>
          Inicio
        </a>
        <a href="administracion.html" class="flex items-center gap-3 rounded-xl bg-blue-50 px-3 py-2.5 text-sm font-medium text-blue-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
          </svg>
          Administración
        </a>
        <a href="finanzas.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"/>
          </svg>
          Finanzas
        </a>

        <div class="mt-auto flex flex-col gap-1 border-t border-slate-100 pt-4">
          <a href="#" class="hidden flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
            </svg>
            Perfil
          </a>
          <button id="btn-cerrar-sesion" type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </nav>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <div class="mb-6 flex items-center justify-between gap-4">
          <h1 class="text-2xl font-bold text-slate-900">Gestión de Vuelos</h1>
          <button id="btn-nuevo-vuelo" type="button" class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">+ Nuevo Vuelo</button>
        </div>

        <section class="overflow-hidden rounded-2xl bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[720px] text-left text-sm">
              <thead class="border-b border-slate-100 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-3">ID</th>
                  <th class="px-5 py-3">Imagen</th>
                  <th class="px-5 py-3">Origen</th>
                  <th class="px-5 py-3">Destino</th>
                  <th class="px-5 py-3">Salida</th>
                  <th class="px-5 py-3">Capacidad</th>
                  <th class="px-5 py-3">Precio Base</th>
                  <th class="px-5 py-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpo-vuelos" class="divide-y divide-slate-100 text-slate-700"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div id="modal-vuelo" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
    <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-vuelo">
      <h2 id="titulo-modal-vuelo" class="text-xl font-bold text-slate-900">Agregar Nuevo Vuelo</h2>
      <form id="form-vuelo" class="mt-5 space-y-4">
        <input type="hidden" id="vuelo-id" name="vuelo_id">
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Origen</span>
          <input id="origen" name="origen" type="text" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Destino</span>
          <input id="destino" name="destino" type="text" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Fecha y Hora de Salida</span>
          <input id="fecha-salida" name="fecha_salida" type="datetime-local" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <div>
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Imagen</span>
          <img id="vista-imagen" alt="" class="mb-3 hidden h-24 w-40 rounded-xl object-cover">
          <div class="flex items-center gap-3">
            <label for="imagen-archivo" class="cursor-pointer rounded-lg bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100">Seleccionar archivo</label>
            <span id="nombre-archivo" class="min-w-0 truncate text-sm text-slate-500">Ningún archivo seleccionado</span>
          </div>
          <input id="imagen-archivo" name="imagen" type="file" accept="image/jpeg,image/png,image/webp" class="sr-only">
          <span class="mt-1.5 block text-xs text-slate-400">JPG, PNG o WEBP. Tamaño máximo de 2 MB.</span>
        </div>
        <label id="campo-capacidad" class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Capacidad de Asientos</span>
          <input id="capacidad-asientos" name="capacidad_asientos" type="number" min="6" step="6" placeholder="Ej: 60" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-medium text-slate-600">Precio Base (Q)</span>
          <input id="precio-base" name="precio_base" type="number" min="0" step="0.01" required class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
        </label>
        <div class="flex items-center justify-end gap-3 pt-2">
          <button id="btn-cancelar-vuelo" type="button" class="rounded-lg bg-slate-200 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-300">Cancelar</button>
          <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">Guardar Vuelo</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/cabecera.js"></script>
  <script src="/js/administracion.js"></script>
</body>
</html>
