<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Confirmar cuenta - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="flex min-h-[100dvh] items-center justify-center overflow-y-auto bg-slate-50 px-4 py-6 font-sans text-slate-800 antialiased">
  <main class="w-full max-w-md rounded-2xl bg-white p-5 shadow-sm sm:p-8">
    <a href="/index.html" class="mb-8 flex justify-center">
      <img src="/imagenes/logotipo_frase.svg" alt="Quetzal Airlines. El cielo de Guatemala" class="h-24 w-auto">
    </a>
    <h1 id="titulo" class="text-center text-2xl font-bold text-slate-900">Confirmando tu cuenta</h1>
    <p id="mensaje" class="mt-3 text-center text-sm text-slate-500">Estamos revisando el enlace.</p>
    <a id="ir-login" href="/login.html" class="mt-6 hidden h-11 w-full items-center justify-center rounded-xl bg-blue-600 px-4 text-sm font-semibold text-white hover:bg-blue-700">Iniciar sesión</a>
    <form id="form-reenvio" class="mt-6 hidden space-y-3">
      <label class="block">
        <span class="mb-1.5 block text-xs font-medium text-slate-600">Correo</span>
        <input id="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm outline-none focus:border-blue-400">
      </label>
      <button type="submit" class="h-11 w-full rounded-xl bg-blue-600 px-4 text-sm font-semibold text-white hover:bg-blue-700">Enviar otro enlace</button>
    </form>
  </main>
  <script src="/js/verificar.js"></script>
</body>
</html>
