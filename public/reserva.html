<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultar Reserva - Proyecto Vuelos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-pagina="reserva">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1"
          >Sistema de Reservas - Proyecto Vuelos</span
        >
        <div id="barra-sesion" class="d-none align-items-center gap-3">
          <span id="nombre-usuario" class="text-white"></span>
          <span id="saldo-usuario" class="badge text-bg-warning"></span>
          <button
            id="cerrar-sesion"
            class="btn btn-danger btn-sm"
            type="button"
          >
            Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>
    <div class="border-bottom bg-white">
      <div class="container">
        <ul class="nav nav-pills py-2">
          <li class="nav-item" id="item-comprar">
            <a class="nav-link" data-nav="cliente" href="cliente.html"
              >Comprar Boleto</a
            >
          </li>
          <li class="nav-item" id="item-consultar">
            <a class="nav-link" data-nav="reserva" href="reserva.html"
              >Consultar Reserva</a
            >
          </li>
          <li class="nav-item d-none" id="item-admin">
            <a class="nav-link" data-nav="admin" href="admin.html"
              >Administrar Vuelos</a
            >
          </li>
        </ul>
      </div>
    </div>

    <main class="container py-4">
      <div class="consulta mx-auto">
        <h1 class="h3 mb-4">Consultar Reserva</h1>
        <div class="input-group input-group-lg mb-4">
          <input
            id="pnr"
            type="text"
            class="form-control text-uppercase"
            placeholder="Ingresa tu PNR"
            maxlength="6"
            autocomplete="off"
          />
          <button id="buscar" class="btn btn-primary" type="button">
            Buscar Pase de Abordar
          </button>
        </div>
        <div id="resultado"></div>
      </div>
    </main>

    <script src="js/app.js" defer></script>
    <script src="js/reserva.js" defer></script>
  </body>
</html>
