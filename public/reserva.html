        <h1 class="text-xl font-semibold text-slate-900">Información de los pasajeros</h1>
        <p class="mt-1 text-sm text-slate-500">Por favor, introduce los datos tal como aparecen en los documentos oficiales de viaje.</p>

        <section class="mt-5 rounded-2xl border border-emerald-200 bg-white p-6 shadow-sm">
          <ol class="mx-auto flex max-w-3xl items-center justify-center gap-3" aria-label="Progreso de la reserva">
            <li class="flex items-center gap-2 text-sm font-medium text-emerald-500">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              </span>
              Vuelos
            </li>
            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm font-semibold text-slate-900" aria-current="step">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-950 text-xs text-white">2</span>

            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm text-slate-400">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-slate-200 text-xs text-slate-500">3</span>
              Asientos
            </li>
            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm text-slate-400">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-slate-200 text-xs text-slate-500">4</span>
              Pago
            </li>
          </ol>

          <div class="mt-6 rounded-xl border border-emerald-100 px-5 py-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <div class="flex items-center gap-3">
                <span class="flex h-7 w-7 items-center justify-center rounded-full bg-emerald-50 text-sm font-semibold text-emerald-600">1</span>
                <h2 class="text-sm font-semibold text-slate-900">Pasajero 1 (Adulto)</h2>
              </div>
              <span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-500">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                Completado
              </span>

            <form class="mt-5 grid grid-cols-1 gap-4 md:grid-cols-6">
              <label class="md:col-span-3">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="nombre" type="text" value="Carlos Javier" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-3">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Apellido <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="apellido" type="text" value="Mendoza Castro" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Fecha de nacimiento <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="fecha" type="text" value="12 / 04 / 1988" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Tipo de documento <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <select id="tipoDocumento" required class="w-full appearance-none rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                    <option>Pasaporte</option>
                    <option>INE</option>
                    <option>Licencia de conducir</option>
                  </select>
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Número de documento <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="numeroDocumento" type="text" value="PAB983214" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nacionalidad <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="nacionalidad" type="text" value="España" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Email <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="email" type="email" value="carlos.mendoza@email.com" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
              <label class="md:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Teléfono de contacto <span class="text-red-500">*</span></span>
                <span class="relative block">
                  <input id="telefono" type="tel" value="+34 612 345 678" required class="w-full rounded-lg border border-emerald-100 bg-emerald-50/70 px-3 py-2.5 pr-10 text-sm text-slate-800 outline-none focus:border-emerald-300">
                  <svg class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
              </label>
            </form>
