<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      const salir = () => {
        if (!localStorage.getItem('token')) {
          localStorage.setItem('redirectAfterLogin', '/pago.html');
          location.replace('/login.html');
          return;
        }
        let asiento = {};
        try {
          asiento = JSON.parse(localStorage.getItem('datosAsiento')) || {};
        } catch (error) {
          asiento = {};
        }
        let lista = [];
        try {
          const guardados = JSON.parse(localStorage.getItem('datosAsientos')) || [];
          lista = Array.isArray(guardados) ? guardados : [];
        } catch (error) {
          lista = [];
        }
        if ((!asiento.asientoId && !lista.length) || !localStorage.getItem('bloqueoLlave')) {
          location.replace('/asientos.html');
        }
      };
      salir();
      window.addEventListener('pageshow', (evento) => {
        if (evento.persisted) {
          salir();
        }
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pago - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <ol id="progreso-reserva" data-paso="4" class="mb-6 flex items-center justify-center gap-3" aria-label="Progreso de la reserva"></ol>

        <div class="grid items-start gap-6 xl:grid-cols-[minmax(0,1.3fr)_380px]">
          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h1 class="text-lg font-semibold text-slate-900">Detalles de Pago</h1>
            <p id="tiempo-bloqueo" class="mt-3 hidden rounded-lg bg-amber-50 px-3 py-2 text-sm font-medium text-amber-800"></p>
            <form id="form-pago" class="mt-5 space-y-4">
              <fieldset class="space-y-2">
                <legend class="mb-2 text-xs font-medium text-slate-600">Método de pago</legend>
                <label class="flex items-center gap-3 rounded-xl border border-blue-200 bg-blue-50 px-3 py-3 text-sm text-slate-800">
                  <input type="radio" name="metodo_pago" value="saldo" checked class="h-4 w-4 accent-blue-700">
                  Mi Billetera Virtual (Saldo: Q <span id="saldo-disponible">Cargando...</span>)
                </label>
                <label class="flex items-center gap-3 rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800">
                  <input type="radio" name="metodo_pago" value="tarjeta" class="h-4 w-4 accent-blue-700">
                  Tarjeta de Crédito / Débito
                </label>
              </fieldset>

              <div id="formulario-tarjeta" class="hidden space-y-4">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Número de tarjeta</span>
                <span class="relative block">
                  <input type="text" inputmode="numeric" autocomplete="cc-number" placeholder="•••• •••• •••• ••••" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 pr-24 text-sm text-slate-800 outline-none focus:border-blue-400">
                  <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center gap-1.5" aria-hidden="true">
                    <span class="rounded bg-[#1a1f71] px-1.5 py-0.5 text-[10px] font-bold italic tracking-tight text-white">VISA</span>
                    <span class="relative h-4 w-6">
                      <span class="absolute left-0 top-0 h-4 w-4 rounded-full bg-[#eb001b]"></span>
                      <span class="absolute left-2 top-0 h-4 w-4 rounded-full bg-[#f79e1b] opacity-90"></span>
                    </span>
                  </span>
                </span>
              </label>

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <label class="block">
                  <span class="mb-1.5 block text-xs font-medium text-slate-600">Fecha de expiración (MM/AA)</span>
                  <input type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
                </label>
                <label class="block">
                  <span class="mb-1.5 block text-xs font-medium text-slate-600">CVC</span>
                  <input type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
                </label>
              </div>

              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre en la tarjeta</span>
                <input type="text" autocomplete="cc-name" placeholder="Como aparece en la tarjeta" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
              </label>
              </div>

              <p class="flex items-center gap-2 text-xs text-slate-500">
                <svg class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                </svg>
                Transacción segura cifrada de extremo a extremo
              </p>
            </form>
          </section>

          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h2 class="text-lg font-semibold text-slate-900">Resumen de compra</h2>
            <dl class="mt-5 space-y-3 text-sm">
              <div class="flex items-center justify-between">
                <dt class="text-slate-500">Tarifa del vuelo</dt>
                <dd id="precio-vuelo" class="font-medium text-slate-800">Q 0.00</dd>
              </div>
              <div class="flex items-center justify-between">
                <dt id="etiqueta-asiento" class="text-slate-500">Asiento</dt>
                <dd id="cargo-asiento" class="font-medium text-slate-800">Q 0.00</dd>
              </div>
            </dl>
            <div class="mt-4 flex items-end justify-between border-t border-slate-200 pt-4">
              <p class="text-sm font-medium text-slate-600">Total a pagar</p>
              <p id="total-pagar" class="text-2xl font-bold text-slate-900">Q 0.00</p>
            </div>
            <div class="mt-6 flex flex-col gap-3">
              <button id="btnPagar" type="submit" form="form-pago" class="min-h-11 w-full min-w-0 whitespace-normal rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-4 py-3 text-center text-sm font-medium leading-5 text-white shadow-md transition-all hover:from-blue-700 hover:to-indigo-700 hover:shadow-lg">Pagar y Confirmar Reserva</button>
              <a id="btnVolver" href="/asientos.html" class="inline-flex min-h-11 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-3 text-center text-sm font-medium text-slate-600 hover:bg-slate-50">Volver</a>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/pago.js"></script>
</body>
</html>
