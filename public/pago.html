<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    if (!localStorage.getItem('token')) {
      localStorage.setItem('redirectAfterLogin', '/pago.html');
      location.replace('/login.html');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pago - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <aside class="flex w-[232px] shrink-0 flex-col border-r border-slate-100 bg-white px-4 py-5">
      <a href="index.html" class="mb-8 flex items-center gap-2.5 px-2">
        <svg class="h-7 w-7 text-blue-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
        <span class="text-[15px] font-semibold tracking-tight text-blue-950">Sistema de Vuelos</span>
      </a>

      <nav class="flex flex-1 flex-col gap-1" aria-label="Principal">
        <a href="index.html" class="flex items-center gap-3 rounded-xl bg-blue-50 px-3 py-2.5 text-sm font-medium text-blue-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
          </svg>
          Inicio
        </a>
        <a href="administracion.html" class="solo-admin flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
          </svg>
          Administración
        </a>
        <a href="finanzas.html" class="solo-admin flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"/>
          </svg>
          Finanzas
        </a>

        <div class="mt-auto flex flex-col gap-1 border-t border-slate-100 pt-4">
          <a href="#" class="hidden flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
            </svg>
            Perfil
          </a>
          <a id="btn-iniciar-sesion" href="/login.html" class="hidden flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m3.75-3 3-3m0 0-3-3m3 3H2.25"/>
            </svg>
            Iniciar Sesión
          </a>
          <button id="btn-cerrar-sesion" type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </nav>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <ol class="mb-6 flex items-center justify-center gap-3" aria-label="Progreso de la reserva">
          <li class="flex items-center gap-2 text-sm font-medium text-emerald-500">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
            </span>
            Vuelos
          </li>
          <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
          <li class="flex items-center gap-2 text-sm font-medium text-emerald-500">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
            </span>
            Pasajeros
          </li>
          <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
          <li class="flex items-center gap-2 text-sm font-medium text-emerald-500">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
            </span>
            Asientos
          </li>
          <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
          <li class="flex items-center gap-2 text-sm font-semibold text-slate-900" aria-current="step">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-950 text-xs text-white">4</span>
            Pago
          </li>
        </ol>

        <div class="grid items-start gap-6 xl:grid-cols-[minmax(0,1.3fr)_380px]">
          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h1 class="text-lg font-semibold text-slate-900">Detalles de Pago</h1>
            <p id="tiempo-bloqueo" class="mt-3 hidden rounded-lg bg-amber-50 px-3 py-2 text-sm font-medium text-amber-800"></p>
            <form id="form-pago" class="mt-5 space-y-4">
              <fieldset class="space-y-2">
                <legend class="mb-2 text-xs font-medium text-slate-600">Método de pago</legend>
                <label class="flex items-center gap-3 rounded-xl border border-blue-200 bg-blue-50 px-3 py-3 text-sm text-slate-800">
                  <input type="radio" name="metodo_pago" value="saldo" checked class="h-4 w-4 accent-blue-700">
                  Mi Billetera Virtual (Saldo: Q <span id="saldo-disponible">Cargando...</span>)
                </label>
                <label class="flex items-center gap-3 rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800">
                  <input type="radio" name="metodo_pago" value="tarjeta" class="h-4 w-4 accent-blue-700">
                  Tarjeta de Crédito / Débito
                </label>
              </fieldset>

              <div id="formulario-tarjeta" class="hidden space-y-4">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Número de tarjeta</span>
                <span class="relative block">
                  <input type="text" inputmode="numeric" autocomplete="cc-number" placeholder="•••• •••• •••• ••••" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 pr-24 text-sm text-slate-800 outline-none focus:border-blue-400">
                  <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center gap-1.5" aria-hidden="true">
                    <span class="rounded bg-[#1a1f71] px-1.5 py-0.5 text-[10px] font-bold italic tracking-tight text-white">VISA</span>
                    <span class="relative h-4 w-6">
                      <span class="absolute left-0 top-0 h-4 w-4 rounded-full bg-[#eb001b]"></span>
                      <span class="absolute left-2 top-0 h-4 w-4 rounded-full bg-[#f79e1b] opacity-90"></span>
                    </span>
                  </span>
                </span>
              </label>

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <label class="block">
                  <span class="mb-1.5 block text-xs font-medium text-slate-600">Fecha de expiración (MM/AA)</span>
                  <input type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
                </label>
                <label class="block">
                  <span class="mb-1.5 block text-xs font-medium text-slate-600">CVC</span>
                  <input type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
                </label>
              </div>

              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre en la tarjeta</span>
                <input type="text" autocomplete="cc-name" placeholder="Como aparece en la tarjeta" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
              </label>
              </div>

              <p class="flex items-center gap-2 text-xs text-slate-500">
                <svg class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                </svg>
                Transacción segura cifrada de extremo a extremo
              </p>
            </form>
          </section>

          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h2 class="text-lg font-semibold text-slate-900">Resumen de compra</h2>
            <dl class="mt-5 space-y-3 text-sm">
              <div class="flex items-center justify-between">
                <dt class="text-slate-500">Tarifa base de vuelo</dt>
                <dd id="precio-vuelo" class="font-medium text-slate-800">Q 0.00</dd>
              </div>
            </dl>
            <div class="mt-4 flex items-end justify-between border-t border-slate-200 pt-4">
              <p class="text-sm font-medium text-slate-600">Total a pagar</p>
              <p id="total-pagar" class="text-2xl font-bold text-slate-900">Q 390.00</p>
            </div>
            <div class="mt-6 flex flex-col gap-3">
              <button id="btnPagar" type="submit" form="form-pago" class="min-h-11 w-full min-w-0 whitespace-normal rounded-lg bg-emerald-500 px-4 py-2.5 text-center text-sm font-semibold leading-5 text-white shadow-sm hover:bg-emerald-600">Pagar y Confirmar Reserva</button>
              <a id="btnVolver" href="/asientos.html" class="inline-flex min-h-11 w-full items-center justify-center rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-center text-sm font-medium text-slate-700 hover:bg-slate-50">Volver</a>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/cabecera.js"></script>
  <script src="/js/pago.js"></script>
</body>
</html>
