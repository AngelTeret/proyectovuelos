<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reportes - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-4 py-6 sm:px-8">
        <div class="mb-6">
          <h1 class="text-xl font-bold text-slate-900 sm:text-2xl">Reportes</h1>
          <p id="descripcion" class="mt-1 max-w-3xl text-sm text-slate-500">Resúmenes del periodo. Elige un reporte y las fechas.</p>
        </div>

        <div id="tipos" class="mb-4 flex gap-2 overflow-x-auto pb-1" role="tablist" aria-label="Tipo de reporte">
          <button type="button" role="tab" data-tipo="vuelos" aria-selected="true" class="h-10 shrink-0 rounded-full px-4 text-sm font-semibold">Vuelos</button>
          <button type="button" role="tab" data-tipo="ingresos" aria-selected="false" class="h-10 shrink-0 rounded-full px-4 text-sm font-semibold">Ingresos</button>
          <button type="button" role="tab" data-tipo="pasajeros" aria-selected="false" class="h-10 shrink-0 rounded-full px-4 text-sm font-semibold">Pasajeros</button>
          <button type="button" role="tab" data-tipo="checkin" aria-selected="false" class="h-10 shrink-0 rounded-full px-4 text-sm font-semibold">Check-in</button>
          <button type="button" role="tab" data-tipo="bitacora" aria-selected="false" class="h-10 shrink-0 rounded-full px-4 text-sm font-semibold">Bitácora</button>
        </div>

        <form id="filtros" class="mb-6 flex flex-col gap-3 rounded-2xl bg-white p-4 shadow-sm lg:flex-row lg:items-end">
          <label class="flex min-w-0 flex-1 flex-col gap-1 text-sm font-medium text-slate-600">
            Desde
            <input id="desde" type="date" required class="h-11 rounded-xl border border-slate-200 px-3 text-slate-800 outline-none focus:border-slate-400">
          </label>
          <label class="flex min-w-0 flex-1 flex-col gap-1 text-sm font-medium text-slate-600">
            Hasta
            <input id="hasta" type="date" required class="h-11 rounded-xl border border-slate-200 px-3 text-slate-800 outline-none focus:border-slate-400">
          </label>
          <button id="consultar" type="submit" class="h-11 rounded-xl bg-blue-600 px-5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60">Ver reporte</button>
          <button id="descargar" type="button" class="h-11 rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-60">Descargar Excel</button>
        </form>

        <section id="resumen" class="mb-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4" aria-live="polite"></section>
        <p id="nota-reporte" class="mb-4 hidden text-sm text-slate-500"></p>

        <section class="mb-6 rounded-2xl bg-white p-5 shadow-sm">
          <h2 id="titulo-grafica" class="text-sm font-semibold text-slate-900">Gráfica</h2>
          <div id="grafica" class="mt-4"></div>
          <p id="nota-grafica" class="mt-3 hidden text-xs text-slate-400"></p>
        </section>

        <section class="overflow-hidden rounded-2xl bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="tabla-movil w-full min-w-[760px] text-left text-sm">
              <thead id="cabeza-tabla" class="border-b border-slate-100 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500"></thead>
              <tbody id="cuerpo-tabla" class="divide-y divide-slate-100 text-slate-700"></tbody>
            </table>
          </div>
          <div id="paginacion" class="flex flex-col gap-3 border-t border-slate-100 px-5 py-3 sm:flex-row sm:items-center sm:justify-between">
            <p id="rango" class="text-sm text-slate-500"></p>
            <div class="flex gap-2">
              <button id="anterior" type="button" class="h-9 rounded-lg border border-slate-200 px-3 text-sm font-medium text-slate-600 hover:bg-slate-50 disabled:opacity-40">Anterior</button>
              <button id="siguiente" type="button" class="h-9 rounded-lg border border-slate-200 px-3 text-sm font-medium text-slate-600 hover:bg-slate-50 disabled:opacity-40">Siguiente</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/reportes.js"></script>
</body>
</html>
