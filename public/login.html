<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans text-slate-800 antialiased">
  <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <div class="mb-8 flex items-center justify-center gap-2.5">
      <svg class="h-8 w-8 text-blue-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      <span class="text-lg font-semibold tracking-tight text-blue-950">Sistema de Vuelos</span>
    </div>

    <h1 class="text-center text-2xl font-bold text-slate-900">Iniciar sesión</h1>
    <p class="mt-2 text-center text-sm text-slate-500">Ingresa con tu correo y contraseña.</p>

    <form id="form-login" class="mt-8 space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-xs font-medium text-slate-600">Email</span>
        <input id="email" name="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
      </label>
      <label class="block">
        <span class="mb-1.5 block text-xs font-medium text-slate-600">Contraseña</span>
        <input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none focus:border-blue-400">
      </label>
      <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">Entrar</button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      ¿No tienes cuenta?
      <a href="registro.html" class="font-semibold text-blue-600 hover:text-blue-700">Regístrate aquí</a>
    </p>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
