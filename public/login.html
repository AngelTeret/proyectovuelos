<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticación - Proyecto Vuelos</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="login">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Sistema de Reservas - Proyecto Vuelos</span>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row">
      <div class="col-md-6 col-lg-5 mx-auto">
        <h1 class="h3 mb-4 text-center">Autenticación</h1>
        <div id="auth-mensaje"></div>
        <form id="form-login" class="card tarjeta-auth">
          <div class="card-body">
            <h2 class="h5 mb-3">Iniciar sesión</h2>
            <div class="mb-3">
              <label class="form-label" for="login-email">Email</label>
              <input class="form-control" id="login-email" type="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">Contraseña</label>
              <input class="form-control" id="login-password" type="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
            <div class="mt-3">
              <button class="btn btn-link px-0" id="ir-registro" type="button">¿No tienes cuenta? Regístrate aquí</button>
            </div>
          </div>
        </form>
        <form id="form-registro" class="card tarjeta-auth d-none">
          <div class="card-body">
            <h2 class="h5 mb-3">Registro</h2>
            <div class="mb-3">
              <label class="form-label" for="reg-nombre">Nombre</label>
              <input class="form-control" id="reg-nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="reg-email">Email</label>
              <input class="form-control" id="reg-email" type="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="reg-password">Contraseña</label>
              <input class="form-control" id="reg-password" type="password" required>
            </div>
            <button class="btn btn-outline-primary" type="submit">Crear cuenta</button>
            <div class="mt-3">
              <button class="btn btn-link px-0" id="ir-login" type="button">¿Ya tienes cuenta? Inicia sesión</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
