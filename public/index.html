<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
        <section class="relative">
          <div class="h-[250px] overflow-hidden rounded-[28px] bg-slate-200 bg-cover bg-center shadow-sm bg-[url('/imagenes/avion-fondo.webp')]"></div>

          <form class="relative z-10 mx-3 -mt-10 rounded-2xl bg-white px-4 py-4 shadow-[0_12px_40px_rgba(15,23,42,0.12)] sm:mx-6 sm:px-6 md:absolute md:inset-x-8 md:bottom-0 md:mx-0 md:mt-0 md:translate-y-1/2">
            <div class="grid grid-cols-1 items-center gap-4 md:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)_auto_minmax(0,1fr)_auto]">
              <label class="min-w-0">
                <span class="block text-[11px] text-slate-400">Origen</span>
                <select id="origen" class="w-full appearance-none bg-transparent text-sm font-semibold text-slate-900 outline-none"></select>
              </label>
              <span class="hidden h-11 w-11 items-center justify-center text-slate-300 md:flex" aria-hidden="true">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
              </span>
              <label class="min-w-0">
                <span class="block text-[11px] text-slate-400">Destino</span>
                <select id="destino" class="w-full appearance-none bg-transparent text-sm font-semibold text-slate-900 outline-none"></select>
              </label>
              <span class="hidden h-8 w-px bg-slate-200 md:block" aria-hidden="true"></span>
              <label class="min-w-0">
                <span class="block text-[11px] text-slate-400">Salida</span>
                <input id="fecha-salida" type="date" class="w-full border-0 bg-transparent p-0 text-sm font-semibold text-slate-900 outline-none">
              </label>
              <button id="buscar-vuelo" type="button" class="h-11 w-full rounded-full bg-blue-500 px-6 text-sm font-medium text-white shadow-sm hover:bg-blue-600 md:w-auto">
                Buscar
              </button>
            </div>
          </form>
        </section>

        <section class="mt-6 grid grid-cols-1 gap-4 md:mt-16 lg:grid-cols-4">
          <div id="destinos" class="contents"></div>


        </section>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
