<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bitácora - Quetzal Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 class="text-xl font-bold text-slate-900 sm:text-2xl">Bitácora</h1>
            <p class="mt-1 text-sm text-slate-500">Inicios de sesión, pagos, cancelaciones y cambios de contraseña. Se muestran los 200 más recientes.</p>
          </div>
          <label class="flex items-center gap-2 text-sm font-medium text-slate-600">
            Acción
            <select id="filtro-accion" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-800">
              <option value="">Todas</option>
              <option value="login">Inicio de sesión</option>
              <option value="pago">Pago</option>
              <option value="cancelacion">Cancelación</option>
              <option value="restablecer">Contraseña</option>
            </select>
          </label>
        </div>

        <section class="overflow-hidden rounded-2xl bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[760px] text-left text-sm">
              <thead class="border-b border-slate-100 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-3">Fecha</th>
                  <th class="px-5 py-3">Quién</th>
                  <th class="px-5 py-3">Acción</th>
                  <th class="px-5 py-3">Detalle</th>
                  <th class="px-5 py-3">Dirección</th>
                </tr>
              </thead>
              <tbody id="cuerpo-bitacora" class="divide-y divide-slate-100 text-slate-700"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/bitacora.js"></script>
</body>
</html>
