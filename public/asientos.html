<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="/js/asientos.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Selecciona tus asientos - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <ol id="progreso-reserva" data-paso="3" class="mb-6 flex items-center justify-center gap-3" aria-label="Progreso de la reserva"></ol>

        <div class="grid items-start gap-6 xl:grid-cols-[minmax(0,1fr)_minmax(0,20rem)]">
          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h1 class="text-lg font-semibold text-slate-900">Selecciona tus asientos</h1>
            <p class="mt-1 text-sm text-slate-500">Elige un asiento por pasajero. Al seleccionarlo queda reservado y puedes elegir el siguiente.</p>
            <div id="mapa-asientos" class="mx-auto mt-6 max-h-[min(36rem,70dvh)] w-full max-w-md overflow-auto px-1">
              <div class="relative mx-auto w-max rounded-t-[100px] border border-slate-200 bg-slate-50/50 px-5 pb-6 pt-8 shadow-inner">
                <div class="mb-3 flex items-center justify-center gap-1.5 text-[11px] font-medium text-slate-400">
                  <span class="inline-flex h-10 w-10 items-center justify-center">A</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">B</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">C</span>
                  <span class="w-6"></span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">D</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">E</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">F</span>
                </div>
                <div id="contenedor-asientos" class="flex flex-col gap-1.5" aria-label="Mapa de asientos"></div>
              </div>
            </div>
            <div class="mt-5 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[11px] text-slate-500">
              <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-indigo-900 shadow-sm"></span>Premium</span>
              <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-blue-600 shadow-sm"></span>Estándar</span>
              <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-slate-300 shadow-sm"></span>Básica</span>
              <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full border border-slate-200 bg-slate-100 shadow-sm"></span>Ocupado</span>
              <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-emerald-500 shadow-sm"></span>Seleccionado</span>
            </div>
            <div class="hidden" aria-hidden="true">
              <span class="rounded-xl bg-indigo-900 text-white transition-all duration-200 hover:-translate-y-0.5 hover:bg-indigo-800 hover:shadow-md bg-blue-600 hover:bg-blue-700 bg-slate-300 text-slate-700 hover:bg-slate-400 scale-105 border-2 border-emerald-400 bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.4)] bg-gradient-to-r from-indigo-900 to-slate-900 bg-indigo-500/20 text-indigo-300 from-blue-600 to-blue-800 bg-white/20 rounded-full bg-slate-200 opacity-60 cursor-not-allowed border border-slate-200 bg-slate-100 text-slate-400 bg-emerald-50 mt-2 border-red-200 px-2.5 py-1 text-xs font-semibold text-red-600 hover:bg-red-50"></span>
            </div>
          </section>

          <div class="flex min-w-0 flex-col gap-4">
            <div class="flex h-44 items-center justify-center rounded-2xl bg-gradient-to-b from-blue-50 to-white shadow-sm" aria-hidden="true">
              <svg class="h-28 w-28 text-blue-300" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
              </svg>
            </div>

            <section class="min-w-0 overflow-hidden rounded-2xl bg-white p-4 shadow-sm sm:p-5">
              <h2 class="text-base font-semibold text-slate-900">Resumen de asientos</h2>
              <p id="nota-infantes" class="mt-1 hidden text-xs leading-4 text-slate-500"></p>
              <ul id="lista-pasajeros" class="mt-4 space-y-3 border-t border-slate-100 pt-4"></ul>
              <button id="btnConfirmarAsiento" type="button" disabled class="mt-4 block w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 py-3 text-center text-sm font-medium text-white shadow-md transition-all hover:from-blue-700 hover:to-indigo-700 hover:shadow-lg disabled:cursor-not-allowed disabled:from-slate-300 disabled:to-slate-300 disabled:text-slate-500 disabled:shadow-none">Continuar al pago</button>
              <a id="btnVolver" href="/pasajeros.html" class="mt-2 block w-full rounded-xl border border-slate-200 py-3 text-center text-sm font-medium text-slate-600 hover:bg-slate-50">Volver</a>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
</body>
</html>
