<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Selecciona tus asientos - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <ol id="progreso-reserva" data-paso="3" class="mb-6 flex items-center justify-center gap-3" aria-label="Progreso de la reserva"></ol>

        <div class="grid items-start gap-6 xl:grid-cols-[minmax(0,1fr)_minmax(0,20rem)]">
          <section class="min-w-0 rounded-2xl bg-white p-4 shadow-sm sm:p-6">
            <h1 class="text-lg font-semibold text-slate-900">Selecciona tus asientos</h1>
            <p class="mt-1 text-sm text-slate-500">Elige el asiento para el pasajero de tu reserva.</p>
            <div id="mapa-asientos" class="mx-auto mt-6 max-h-[min(32rem,70dvh)] w-full max-w-md overflow-auto">
              <div class="mx-auto w-max pb-1">
                <div class="mb-2 flex items-center justify-center gap-1.5 text-[11px] font-medium text-slate-400">
                  <span class="inline-flex h-10 w-10 items-center justify-center">A</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">B</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">C</span>
                  <span class="w-6"></span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">D</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">E</span>
                  <span class="inline-flex h-10 w-10 items-center justify-center">F</span>
                </div>
                <div id="contenedor-asientos" class="flex flex-col gap-1.5" aria-label="Mapa de asientos"></div>
              </div>
            </div>
            <div class="mt-6 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-xs text-slate-500">
              <span class="inline-flex items-center gap-2"><span class="h-4 w-4 rounded border border-blue-400 bg-white"></span>Disponible</span>
              <span class="inline-flex items-center gap-2"><span class="h-4 w-4 rounded bg-slate-200"></span>Ocupado</span>
              <span class="inline-flex items-center gap-2"><span class="h-4 w-4 rounded bg-blue-600"></span>Seleccionado</span>
              <span class="inline-flex items-center gap-2"><span class="flex h-4 w-4 items-center justify-center rounded bg-slate-100 text-[10px] text-slate-300">&times;</span>Restringido</span>
            </div>
          </section>

          <div class="flex min-w-0 flex-col gap-4">
            <div class="flex h-44 items-center justify-center rounded-2xl bg-white shadow-sm" aria-hidden="true">
              <svg class="h-28 w-28 text-slate-300" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
              </svg>
            </div>

            <section class="min-w-0 overflow-hidden rounded-2xl bg-white p-4 shadow-sm sm:p-5">
              <h2 class="text-base font-semibold text-slate-900">Resumen de asientos</h2>
              <div class="mt-4 border-t border-slate-100 pt-4">
                <div class="flex min-w-0 items-start gap-2">
                  <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xs font-semibold text-slate-600">1</span>
                  <p id="nombre-pasajero" class="min-w-0 flex-1 break-words text-sm font-medium leading-5 text-slate-800" title="">Pasajero</p>
                </div>
                <div class="mt-3 flex items-center justify-between rounded-lg bg-blue-50 px-3 py-2.5">
                  <div>
                    <p id="asiento-seleccionado" class="text-sm font-semibold text-blue-700">Elige un asiento</p>
                    <p id="categoria-asiento" class="hidden text-[11px] text-slate-400"></p>
                  </div>
                  <p id="precio-extra" class="text-sm font-semibold text-slate-800">Q 0.00</p>
                </div>
              </div>
              <a id="btnConfirmarAsiento" href="#" class="mt-4 block w-full rounded-lg bg-blue-500 py-2.5 text-center text-sm font-semibold text-white hover:bg-blue-600">Confirmar selección</a>
              <a id="btnVolver" href="/pasajeros.html" class="mt-2 block w-full rounded-lg border border-slate-200 py-2.5 text-center text-sm font-semibold text-blue-700 hover:bg-slate-50">Volver</a>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/asientos.js"></script>
</body>
</html>
