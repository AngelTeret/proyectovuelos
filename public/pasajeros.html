<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Información de los pasajeros - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
    <aside class="flex w-[232px] shrink-0 flex-col border-r border-slate-100 bg-white px-4 py-5">
      <a href="index.html" class="mb-8 flex items-center gap-2.5 px-2">
        <svg class="h-7 w-7 text-blue-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
        <span class="text-[15px] font-semibold tracking-tight text-blue-950">Sistema de Vuelos</span>
      </a>

      <nav class="flex flex-1 flex-col gap-1" aria-label="Principal">
        <a href="index.html" class="flex items-center gap-3 rounded-xl bg-blue-50 px-3 py-2.5 text-sm font-medium text-blue-600">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
          </svg>
          Inicio
        </a>
        <a href="administracion.html" class="solo-admin flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
          </svg>
          Administración
        </a>
        <a href="finanzas.html" class="solo-admin flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"/>
          </svg>
          Finanzas
        </a>

        <div class="mt-auto flex flex-col gap-1 border-t border-slate-100 pt-4">
          <a href="#" class="hidden flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
            </svg>
            Perfil
          </a>
          <a id="btn-iniciar-sesion" href="/login.html" class="hidden flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m3.75-3 3-3m0 0-3-3m3 3H2.25"/>
            </svg>
            Iniciar Sesión
          </a>
          <button id="btn-cerrar-sesion" type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-slate-500 hover:bg-slate-50">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </nav>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <h1 class="text-xl font-semibold text-slate-900">Información de los pasajeros</h1>
        <p class="mt-1 text-sm text-slate-500">Por favor, introduce los datos tal como aparecen en los documentos oficiales de viaje.</p>

        <section class="mt-5 rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm sm:p-6">
          <ol class="mx-auto flex max-w-3xl items-center justify-center gap-3" aria-label="Progreso de la reserva">
            <li class="flex items-center gap-2 text-sm font-medium text-emerald-500">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              </span>
              Vuelos
            </li>
            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm font-semibold text-slate-900" aria-current="step">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-950 text-xs text-white">2</span>
              Pasajeros
            </li>
            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm text-slate-400">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-slate-200 text-xs text-slate-500">3</span>
              Asientos
            </li>
            <li class="h-px w-10 bg-slate-200" aria-hidden="true"></li>
            <li class="flex items-center gap-2 text-sm text-slate-400">
              <span class="flex h-6 w-6 items-center justify-center rounded-full bg-slate-200 text-xs text-slate-500">4</span>
              Pago
            </li>
          </ol>

          <form id="form-pasajero" novalidate class="mx-auto mt-6 max-w-3xl rounded-xl border border-slate-200 px-4 py-5 sm:px-5">
            <div class="border-b border-slate-100 pb-4">
              <h2 class="text-sm font-semibold text-slate-900">Pasajero</h2>
            </div>

            <div class="mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2">
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre <span class="text-red-500">*</span></span>
                <input id="nombre" name="nombre" type="text" required maxlength="100" autocomplete="given-name" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-nombre" class="mt-1 text-xs text-slate-500" aria-live="polite">0/100 caracteres</p>
                <p id="error-nombre" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Apellido <span class="text-red-500">*</span></span>
                <input id="apellido" name="apellido" type="text" required maxlength="100" autocomplete="family-name" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-apellido" class="mt-1 text-xs text-slate-500" aria-live="polite">0/100 caracteres</p>
                <p id="error-apellido" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Documento de identidad <span class="text-red-500">*</span></span>
                <input id="documento_identidad" name="documento_identidad" type="text" required minlength="6" maxlength="15" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-documento_identidad" class="mt-1 text-xs text-slate-500" aria-live="polite">0/15 caracteres</p>
                <p id="error-documento_identidad" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Email <span class="text-red-500">*</span></span>
                <input id="email" name="email" type="email" required maxlength="255" autocomplete="email" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="error-email" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <div class="sm:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Teléfono <span class="text-red-500">*</span></span>
                <div class="grid grid-cols-1 gap-2 sm:grid-cols-[minmax(0,13.5rem)_minmax(0,1fr)]">
                  <div class="relative">
                    <input id="codigo-telefono" type="text" required autocomplete="off" placeholder="Busca un país" role="combobox" aria-expanded="false" aria-controls="lista-codigo-telefono" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                    <ul id="lista-codigo-telefono" role="listbox" class="absolute z-20 mt-1 hidden max-h-48 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg"></ul>
                  </div>
                  <input id="telefono" name="telefono" type="tel" required maxlength="15" inputmode="numeric" autocomplete="tel-national" placeholder="8 a 15 dígitos" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                </div>
                <p id="error-telefono" class="mt-1 hidden text-xs text-red-600"></p>
              </div>
            </div>
          </form>
        </section>

        <div class="mx-auto mt-5 flex max-w-3xl flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
          <a id="btnVolver" href="/index.html" class="inline-flex h-11 items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
            Volver
          </a>
          <button id="btnContinuar" type="submit" form="form-pasajero" class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-blue-800 px-5 text-sm font-medium text-white shadow-sm hover:bg-blue-900">
            Continuar a selección
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
          </button>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/cabecera.js"></script>
  <script src="/js/pasajeros.js"></script>
</body>
</html>
