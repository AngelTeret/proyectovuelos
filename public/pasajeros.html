<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      const sinVuelo = () => {
        let busqueda = {};
        try {
          busqueda = JSON.parse(localStorage.getItem('busquedaVuelo')) || {};
        } catch (error) {
          busqueda = {};
        }
        if (!busqueda.vuelo_id) {
          location.replace('/index.html');
        }
      };
      sinVuelo();
      window.addEventListener('pageshow', (evento) => {
        if (evento.persisted) {
          sinVuelo();
        }
      });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Información de los pasajeros - Sistema de Vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="h-[100dvh] overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex h-[100dvh] bg-slate-50">
<div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-end border-b border-slate-100 bg-white px-6">
        <p id="nombre-usuario" class="text-sm font-semibold text-slate-800"></p>
      </header>

      <main id="app-content" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-8 py-6">
        <h1 class="text-xl font-semibold text-slate-900">Información de los pasajeros</h1>
        <p class="mt-1 text-sm text-slate-500">Por favor, introduce los datos tal como aparecen en los documentos oficiales de viaje.</p>

        <section class="mt-5 rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm sm:p-6">
          <ol id="progreso-reserva" data-paso="2" class="mx-auto flex max-w-3xl items-center justify-center gap-3" aria-label="Progreso de la reserva"></ol>

          <form id="form-pasajero" novalidate class="mx-auto mt-6 max-w-3xl rounded-xl border border-slate-200 px-4 py-5 sm:px-5">
            <div class="border-b border-slate-100 pb-4">
              <h2 class="text-sm font-semibold text-slate-900">Pasajero</h2>
            </div>

            <div class="mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2">
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Nombre <span class="text-red-500">*</span></span>
                <input id="nombre" name="nombre" type="text" required maxlength="100" autocomplete="given-name" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-nombre" class="mt-1 text-xs text-slate-500" aria-live="polite">0/100 caracteres</p>
                <p id="error-nombre" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Apellido <span class="text-red-500">*</span></span>
                <input id="apellido" name="apellido" type="text" required maxlength="100" autocomplete="family-name" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-apellido" class="mt-1 text-xs text-slate-500" aria-live="polite">0/100 caracteres</p>
                <p id="error-apellido" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Documento de identidad <span class="text-red-500">*</span></span>
                <input id="documento_identidad" name="documento_identidad" type="text" required minlength="6" maxlength="15" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="contador-documento_identidad" class="mt-1 text-xs text-slate-500" aria-live="polite">0/15 caracteres</p>
                <p id="error-documento_identidad" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <label>
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Email <span class="text-red-500">*</span></span>
                <input id="email" name="email" type="email" required maxlength="255" autocomplete="email" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                <p id="error-email" class="mt-1 hidden text-xs text-red-600"></p>
              </label>
              <div class="sm:col-span-2">
                <span class="mb-1.5 block text-xs font-medium text-slate-600">Teléfono <span class="text-red-500">*</span></span>
                <div class="grid grid-cols-1 gap-2 sm:grid-cols-[minmax(0,13.5rem)_minmax(0,1fr)]">
                  <div class="relative">
                    <input id="codigo-telefono" type="text" required autocomplete="off" placeholder="Busca un país" role="combobox" aria-expanded="false" aria-controls="lista-codigo-telefono" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                    <ul id="lista-codigo-telefono" role="listbox" class="absolute z-20 mt-1 hidden max-h-48 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg"></ul>
                  </div>
                  <input id="telefono" name="telefono" type="tel" required maxlength="15" inputmode="numeric" autocomplete="tel-national" placeholder="8 a 15 dígitos" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-400">
                </div>
                <p id="error-telefono" class="mt-1 hidden text-xs text-red-600"></p>
              </div>
            </div>
          </form>
        </section>

        <div class="mx-auto mt-5 flex max-w-3xl flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
          <a id="btnVolver" href="/index.html" class="inline-flex h-11 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-600 hover:bg-slate-50">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
            Volver
          </a>
          <button id="btnContinuar" type="submit" form="form-pasajero" class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 text-sm font-medium text-white shadow-md transition-all hover:from-blue-700 hover:to-indigo-700 hover:shadow-lg">
            Continuar a selección
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
          </button>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/util.js"></script>
  <script src="/js/cabecera.js"></script>
  <script src="/js/pasajeros.js"></script>
</body>
</html>
