<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar Boleto - Quetzal Airlines</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="cliente">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand mb-0 p-0" href="index.html"><img src="/imagenes/logotipo.svg" alt="Quetzal Airlines" style="height:40px;width:auto;background:#fff;border-radius:8px;padding:4px 8px"></a>
      <div id="barra-sesion" class="d-none align-items-center gap-3">
        <span id="nombre-usuario" class="text-white"></span>
        <span id="saldo-usuario" class="badge text-bg-warning"></span>
        <button id="cerrar-sesion" class="btn btn-danger btn-sm" type="button">Cerrar Sesión</button>
      </div>
    </div>
  </nav>
  <div class="border-bottom bg-white">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item" id="item-comprar">
          <a class="nav-link" data-nav="cliente" href="cliente.html">Comprar Boleto</a>
        </li>
        <li class="nav-item" id="item-consultar">
          <a class="nav-link" data-nav="reserva" href="reserva.html">Consultar Reserva</a>
        </li>
        <li class="nav-item d-none" id="item-admin">
          <a class="nav-link" data-nav="admin" href="admin.html">Administrar Vuelos</a>
        </li>
      </ul>
    </div>
  </div>

  <main class="container py-4">
    <h1 class="h3 mb-4">Comprar Boleto</h1>
    <div id="vuelos" class="row g-3 mb-4"></div>
    <div id="mapa-asientos"></div>
    <form id="form-reserva" class="card d-none mt-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Reservar asiento <span id="asiento-elegido"></span></h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" name="nombre" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="apellido">Apellido</label>
            <input class="form-control" id="apellido" name="apellido" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="documento">Documento</label>
            <input class="form-control" id="documento" name="documento" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="telefono">Teléfono</label>
            <input class="form-control" id="telefono" name="telefono" required>
          </div>
        </div>
        <p class="text-secondary mt-3 mb-3">Monto simulado: $150.00</p>
        <button class="btn btn-primary" id="confirmar-reserva" type="submit">Confirmar reserva</button>
      </div>
    </form>
    <div id="compra-mensaje" class="mt-3"></div>
  </main>

  <script src="js/app.js" defer></script>
  <script src="js/cliente.js" defer></script>
</body>
</html>
