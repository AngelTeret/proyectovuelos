<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/imagenes/isotipo.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Vuelos - Quetzal Airlines</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="admin">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand mb-0 p-0" href="index.html"><img src="/imagenes/logotipo.svg" alt="Quetzal Airlines" style="height:40px;width:auto;background:#fff;border-radius:8px;padding:4px 8px"></a>
      <div id="barra-sesion" class="d-none align-items-center gap-3">
        <span id="nombre-usuario" class="text-white"></span>
        <span id="saldo-usuario" class="badge text-bg-warning"></span>
        <button id="cerrar-sesion" class="btn btn-danger btn-sm" type="button">Cerrar Sesión</button>
      </div>
    </div>
  </nav>
  <div class="border-bottom bg-white">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item" id="item-comprar">
          <a class="nav-link" data-nav="cliente" href="cliente.html">Comprar Boleto</a>
        </li>
        <li class="nav-item" id="item-consultar">
          <a class="nav-link" data-nav="reserva" href="reserva.html">Consultar Reserva</a>
        </li>
        <li class="nav-item d-none" id="item-admin">
          <a class="nav-link" data-nav="admin" href="admin.html">Administrar Vuelos</a>
        </li>
      </ul>
    </div>
  </div>

  <main class="container py-4" id="panel-admin">
    <h1 class="h3 mb-4">Administrar Vuelos</h1>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Crear Nuevo Vuelo</h2>
        <form id="form-vuelo" class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="origen">Origen</label>
            <input class="form-control" id="origen" name="origen" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="destino">Destino</label>
            <input class="form-control" id="destino" name="destino" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="fecha-salida">Fecha de Salida</label>
            <input class="form-control" id="fecha-salida" name="fecha_salida" type="datetime-local" required>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Crear vuelo</button>
          </div>
        </form>
      </div>
    </section>

    <section>
      <h2 class="h5 mb-3">Catálogo de vuelos</h2>
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Origen</th>
              <th>Destino</th>
              <th>Fecha</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-vuelos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
