version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: contenedor_vuelos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdvuelos
      TZ: America/Guatemala
    command: --default-time-zone=-06:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: